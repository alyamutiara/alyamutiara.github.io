<footer class="footer">
  <div class="container">
    <div class="footer__divider" aria-hidden="true"></div>
    <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. All rights reserved.</p>
  </div>
</footer>

<script>
(function() {
  var nav = document.getElementById('nav');
  var navToggle = document.getElementById('navToggle');
  var navLinks = document.getElementById('navLinks');
  var navAnchors = navLinks.querySelectorAll('a');
  var themeToggle = document.getElementById('themeToggle');

  navToggle.addEventListener('click', function() {
    var open = navToggle.getAttribute('aria-expanded') === 'true';
    navToggle.setAttribute('aria-expanded', !open);
    navLinks.classList.toggle('nav__links--open');
  });

  navAnchors.forEach(function(a) {
    a.addEventListener('click', function() {
      navToggle.setAttribute('aria-expanded', 'false');
      navLinks.classList.remove('nav__links--open');
    });
  });

  document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {
    anchor.addEventListener('click', function(e) {
      e.preventDefault();
      var target = document.querySelector(this.getAttribute('href'));
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  window.addEventListener('scroll', function() {
    if (window.scrollY > 80) {
      nav.classList.add('nav--scrolled');
    } else {
      nav.classList.remove('nav--scrolled');
    }
  }, { passive: true });

  themeToggle.addEventListener('click', function() {
    var html = document.documentElement;
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  var reveals = document.querySelectorAll('.reveal');
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('reveal--visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08 });

  reveals.forEach(function(el) {
    observer.observe(el);
  });

  (function() {
    var grid = document.getElementById('blogGrid');
    if (!grid) return;
    fetch('https://api.rss2json.com/v1/api.json?rss_url=https://medium.com/feed/@mutiaraa')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.items || data.items.length === 0) {
          grid.innerHTML = '<div class="blog__loading">No posts found.</div>';
          return;
        }
        var posts = data.items.slice(0, 3);
        grid.innerHTML = posts.map(function(item) {
          var date = new Date(item.pubDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
          return '<article class="blog__card"><div class="blog__card-accent" aria-hidden="true"></div><span class="blog__card-date">' + date + '</span><h3 class="blog__card-title">' + item.title + '</h3><a href="' + item.link + '" class="blog__card-link" target="_blank" rel="noopener noreferrer">Read on Medium &rarr;</a></article>';
        }).join('');
      })
      .catch(function() {
        grid.innerHTML = '<div class="blog__loading">Could not load posts.</div>';
      });
  })();
})();
</script>
