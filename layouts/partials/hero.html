<section class="hero reveal" id="hero">
  <div class="hero__bg" aria-hidden="true"></div>
  <div class="container">
    <div class="hero__top">
      <div class="hero__socials">
        <a href="{{ .Site.Params.social.linkedin }}" class="hero__social-link" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>
        </a>
        <a href="{{ .Site.Params.social.github }}" class="hero__social-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        </a>
        <a href="{{ .Site.Params.social.medium }}" class="hero__social-link" target="_blank" rel="noopener noreferrer" aria-label="Medium">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13.54 12a6.8 6.8 0 0 1-6.77 6.82A6.8 6.8 0 0 1 0 12a6.8 6.8 0 0 1 6.77-6.82A6.8 6.8 0 0 1 13.54 12zM20.96 12c0 3.54-1.51 6.42-3.37 6.42-1.87 0-3.38-2.88-3.38-6.42s1.51-6.42 3.38-6.42c1.86 0 3.37 2.88 3.37 6.42zM24 12c0 3.17-.79 5.75-1.77 5.75-.97 0-1.76-2.58-1.76-5.75s.79-5.75 1.76-5.75c.98 0 1.77 2.58 1.77 5.75z"/></svg>
        </a>
        <a href="mailto:{{ .Site.Params.social.email }}" class="hero__social-link" aria-label="Email">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </a>
      </div>
      <a href="{{ .Site.Params.resumeUrl }}" class="hero__resume-link" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Resume
      </a>
    </div>
    <div class="hero__intro">
      <div class="hero__photo-wrapper">
        <img src="/img/photo.jpg" alt="{{ .Site.Params.author }}" class="hero__photo" onerror="this.style.display='none'">
      </div>
      <div>
        <div class="hero__tag">Data Engineer</div>
        <h1 class="hero__headline">{{ .Site.Params.hero.headline }}</h1>
        <p class="hero__subtext">{{ .Site.Params.hero.subtext }}</p>
        <div class="hero__actions">
          <a href="#projects" class="hero__cta">{{ .Site.Params.hero.cta }} &darr;</a>
          <a href="#contact" class="hero__cta hero__cta--ghost">Get in Touch</a>
        </div>
      </div>
    </div>
  </div>
</section>
