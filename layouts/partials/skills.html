<section class="section section--alt reveal" id="skills">
  <div class="container">
    <div class="section__header">
      <span class="section__number">04</span>
      <h2 class="section__title">Skills</h2>
    </div>
    <div class="skills__grid">
      {{ range hugo.Data.skills }}
      <div class="skills__category">
        <h3 class="skills__category-title">{{ .category }}</h3>
        <div class="skills__items">
          {{ range .items }}
          <div class="skill-item">
            {{ if .icon }}<i class="skill-item__icon {{ .icon }}"></i>{{ end }}
            <span class="skill-item__name">{{ .name }}</span>
          </div>
          {{ end }}
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
